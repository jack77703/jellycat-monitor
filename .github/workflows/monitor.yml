name: Jellycat Diner availability monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_availability.py

      - name: Commit updated seen-slots state
        run: |
          git config user.name "jellycat-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- seen_open_slots.json; then
            git add seen_open_slots.json
            git commit -m "Update seen open slots"
            git push
          fi
