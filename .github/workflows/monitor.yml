name: Jellycat Diner availability monitor

# Each job runs a ~4h55m internal loop (2-min check cadence, see loop() in
# check_availability.py) and, right before it ends, re-triggers this workflow
# itself so the next job starts within seconds - not at the next fixed cron
# slot, which could otherwise leave a multi-hour monitoring gap. The cron
# schedule below is only a safety net in case a self-trigger ever fails to
# fire (e.g. a transient API error).
on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: jellycat-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git identity for self-committing state
        run: |
          git config user.name "jellycat-monitor-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run monitor loop (checks every 2 minutes for ~4h55m)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python check_availability.py

      - name: Trigger next run immediately (closes the cron-grid gap)
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml
